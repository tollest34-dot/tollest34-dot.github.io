<!doctype html>
<html lang="fr">
<head>
<title>TOLLEST Commande</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D5412A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : bandeau pleine largeur (logo, accueil, décor de fête), bandeau promo, filtres collants,
   grille de plats, barre de panier, tiroirs (fiche plat, panier, commande, administration). */
:root {
  --bg: #FBF5EE;
  --surface: #FFFFFF;
  --fg: #2B1B15;
  --muted: #76665D;
  --line: #EBDFD3;
  --soft: #F6E9DC;
  --accent: #C93A1D;
  --accent-fg: #FFFFFF;
  --accent-text: #B5311A;
  --hero-a: #D5412A;
  --hero-b: #8A2212;
  --err: #B3261E;
  --good: #2E7D4F;
  --gold: #F1A33B;
  --shadow: 0 6px 20px rgba(60, 25, 10, .14);
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171009; --surface: #241913; --fg: #F7EDE5; --muted: #BBA99E; --line: #3B2C24; --soft: #32231B;
    --accent: #D9462A; --accent-text: #FF7A59; --hero-a: #B8341F; --hero-b: #5E160B; --err: #FF8A80; --good: #4FAE78;
    --shadow: 0 6px 20px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171009; --surface: #241913; --fg: #F7EDE5; --muted: #BBA99E; --line: #3B2C24; --soft: #32231B;
  --accent: #D9462A; --accent-text: #FF7A59; --hero-a: #B8341F; --hero-b: #5E160B; --err: #FF8A80; --good: #4FAE78;
  --shadow: 0 6px 20px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
/* Thèmes de fête choisis par l'administrateur (après les blocs sombres pour l'emporter) */
:root[data-event="decembre"] { --hero-a: #1E7A4C; --hero-b: #0E3F29; --accent: #C0281F; --accent-text: color-mix(in srgb, var(--accent) 62%, var(--fg)); }
:root[data-event="nouvelan"] { --hero-a: #2E2950; --hero-b: #0E0C1D; --accent: #946106; --accent-text: color-mix(in srgb, var(--accent) 62%, var(--fg)); }
:root[data-event="ramadan"] { --hero-a: #14506E; --hero-b: #09283D; --accent: #0F7A6B; --accent-text: color-mix(in srgb, var(--accent) 62%, var(--fg)); }

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.in {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Bandeau */
.hero { background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); color: #fff; border-radius: 0 0 32px 32px; padding-block: 26px 36px; }
.hero .in { position: relative; }
.logo { display: inline-flex; align-items: center; background: #fff; border-radius: 22px; padding: 8px 16px; box-shadow: var(--shadow); }
.logo img { display: block; height: 58px; width: auto; max-width: 100%; }
.topbtns { position: absolute; top: 0; right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.adm { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 8px 14px; font-weight: 700; }
.adm b { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--gold); color: #3A1608; font-size: .75rem; }
.deco { margin-top: 16px; font-size: 1.35rem; letter-spacing: .2em; }
.hello { margin-top: 14px; font: 800 2rem/1.1 var(--font-display); text-wrap: balance; }
.sub { margin-top: 6px; opacity: .92; }
.banner { margin-top: 14px; }
.banner > .plain { padding: 12px 14px; border-radius: 16px; background: var(--soft); border: 1px solid var(--line); color: var(--fg); font-weight: 700; text-align: center; text-wrap: balance; overflow-wrap: anywhere; }

/* Filtres */
.chips { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; }
.chiprow { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.chiprow::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }

/* Menu */
main { padding-bottom: 150px; }
.cat { margin-top: 18px; }
.cat-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; font: 800 .8rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.cat-h span { font-weight: 500; letter-spacing: .04em; text-transform: none; }
.cat.promo .cat-h { color: var(--accent-text); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--rad, 22px); overflow: hidden; min-width: 0; }
.card:active { transform: scale(.985); }
.tile { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; max-width: 100%; overflow: hidden; background: linear-gradient(150deg, hsl(var(--h) 72% 58%), hsl(var(--h) 68% 38%)); }
.tile.ph::before { content: ""; position: absolute; left: 50%; top: 50%; width: 56%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.96) 0 52%, rgba(255,255,255,.5) 53% 100%); }
.tile b { position: relative; font: 800 1.9rem/1 var(--font-display); color: hsl(var(--h) 65% 28%); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tag { position: absolute; top: 8px; left: 8px; z-index: 1; background: var(--gold); color: #3A1608; font-weight: 800; font-size: .8rem; border-radius: 999px; padding: 4px 10px; }
.cbody { display: flex; flex-direction: column; gap: 4px; padding: 12px 12px 14px; min-width: 0; flex: 1; }
.cname { font: 700 1rem/1.2 var(--font-display); text-wrap: balance; }
.cdesc { color: var(--muted); font-size: .85rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cprice { margin-top: auto; padding-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cprice small { font-weight: 500; color: var(--muted); }
.old { text-decoration: line-through; color: var(--muted); font-weight: 500; font-size: .8rem; display: block; }
.until { display: block; font-size: .72rem; font-weight: 700; color: var(--accent-text); }
.plus { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 1.2rem; line-height: 1; }
.note { margin-top: 26px; color: var(--muted); font-size: .85rem; }

/* Barre de panier */
.bar { position: fixed; inset: auto 0 0 0; z-index: 20; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.bar button { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 560px; margin: 0 auto; border: 0; border-radius: 20px; background: var(--accent); color: var(--accent-fg); padding: 15px 18px; font-weight: 700; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
.bar .cnt { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px; background: #fff; color: #2B1B15; margin-right: 10px; font-size: .85rem; }

.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Tiroir */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(20, 8, 2, .55); }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 40; transform: translateX(-50%); width: min(560px, 100%); max-height: 92%; display: flex; flex-direction: column; background: var(--bg); border-radius: 28px 28px 0 0; outline: none; animation: rise .25s ease-out; }
.sheet.tall { height: 92%; }
@keyframes rise { from { transform: translate(-50%, 28px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { font: 800 1.35rem/1.15 var(--font-display); text-wrap: balance; }
.x { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--soft); }
.sheet-body { overflow-y: auto; flex: 1; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sheet-foot { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.grp { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.grp > legend, .lg { padding: 0; margin-bottom: 8px; font: 800 .78rem/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; cursor: pointer; }
.opt input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0 8px 0 0; vertical-align: -3px; }
.pr { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
input[type="text"], input[type="tel"], input[type="number"], input[type="date"], input[type="time"], select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
textarea { resize: vertical; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; background: var(--soft); border-radius: 16px; }
.seg label { position: relative; min-width: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; text-align: center; padding: 10px 4px; border-radius: 12px; font-weight: 500; font-size: .9rem; }
.seg input:checked + span { background: var(--surface); font-weight: 700; box-shadow: 0 1px 4px rgba(60, 25, 10, .15); }
.seg input:focus-visible + span { outline: 3px solid var(--gold); }
.btn { flex: 1; border: 0; border-radius: 16px; background: var(--accent); color: var(--accent-fg); padding: 15px 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-variant-numeric: tabular-nums; text-align: left; }
.btn.center { justify-content: center; text-align: center; }
.btn.ghost { background: var(--soft); color: var(--fg); }
.btn.sm { flex: 0 0 auto; padding: 9px 14px; font-size: .9rem; border-radius: 12px; }
.btn[disabled] { opacity: .6; cursor: default; }
a.btn { text-decoration: none; }
.stepper { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 1.1rem; line-height: 1; }
.stepper output { min-width: 28px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.line { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.line .t { min-width: 0; flex: 1; }
.line .t b { font-family: var(--font-display); font-size: 1rem; }
.line .t div { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.line .r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.rm { border: 0; background: none; color: var(--accent-text); font-size: .8rem; padding: 0; text-decoration: underline; }
.sum { display: flex; flex-direction: column; gap: 6px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; font-variant-numeric: tabular-nums; }
.sum div { display: flex; justify-content: space-between; gap: 12px; }
.sum .tot { font-weight: 800; font-size: 1.1rem; padding-top: 6px; border-top: 1px solid var(--line); }
.err { color: var(--err); font-weight: 500; min-height: 1.2em; }
.empty { text-align: center; padding: 28px 8px; color: var(--muted); }
.order-no { font: 800 2.2rem/1 var(--font-display); letter-spacing: .03em; }
.recap { white-space: pre-wrap; overflow-wrap: anywhere; font-size: .85rem; background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 14px; margin: 0; font-family: var(--font-body); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 160px; }
.steps { display: flex; gap: 6px; margin-top: 10px; }
.steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--accent); }
.stat { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.stat b { font-family: var(--font-display); font-size: 1.1rem; }

/* Administration */
.tabs { display: flex; overflow-x: auto; scrollbar-width: none; gap: 6px; padding: 4px; background: var(--soft); border-radius: 16px; margin: 4px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.tabs button { flex: none; white-space: nowrap; border: 0; background: none; padding: 10px 14px; border-radius: 12px; font-weight: 500; font-size: .88rem; }
.tabs button[aria-selected="true"] { background: var(--surface); font-weight: 700; box-shadow: 0 1px 4px rgba(60, 25, 10, .15); }
.ord { display: flex; flex-direction: column; gap: 8px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.ord-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ord-h b { font: 800 1.05rem/1 var(--font-display); }
.ord ul { margin: 0; padding-left: 18px; overflow-wrap: anywhere; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--soft); font-size: .78rem; font-weight: 700; }
.pill.new { background: var(--accent); color: var(--accent-fg); }
.pill.ok { background: var(--good); color: #fff; }
.pill.no { background: transparent; border: 1px solid var(--err); color: var(--err); }
.pill.test { background: var(--gold); color: #3A1608; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.emo { display: flex; gap: 6px; flex-wrap: wrap; }
.emo button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 1.1rem; line-height: 1; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.prow, .zrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.prow span { min-width: 0; overflow-wrap: anywhere; }
.zrow input[type="text"] { flex: 1 1 auto; min-width: 0; }
.zrow input[type="number"] { flex: 0 0 96px; }
.chk { display: flex; align-items: center; gap: 10px; }
.chk input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; }

.card.off { opacity: .65; }
.card.off .plus { display: none; }
.tag.off { background: var(--fg); color: var(--bg); }
.unav { display: block; font-size: .78rem; font-weight: 700; color: var(--err); }
.mrow { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.thumb { flex: none; width: 48px; height: 48px; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: linear-gradient(150deg, hsl(var(--h) 72% 58%), hsl(var(--h) 68% 38%)); color: #fff; font: 800 1.2rem/1 var(--font-display); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mrow .mt { flex: 1; min-width: 0; }
.mrow .mt b { display: block; font-family: var(--font-display); overflow-wrap: anywhere; }
.mrow .mt span { font-size: .82rem; color: var(--muted); }
.mrow .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.ephoto { display: flex; align-items: center; gap: 12px; }
.ephoto .thumb { width: 84px; height: 84px; border-radius: 16px; font-size: 2rem; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; }
.szrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; }
.szrow input { width: 120px; }

/* Affiches et vidéos entre les catégories */
.ad { position: relative; margin: 18px 0 0; border-radius: 22px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); }
.ad img, .ad video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
.ad figcaption { padding: 10px 14px; font-weight: 700; text-wrap: balance; overflow-wrap: anywhere; }
.ad .hint { position: absolute; top: 10px; right: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, .55); color: #fff; font-size: .75rem; font-weight: 500; pointer-events: none; }

/* Carte de fidélité */
.reward { display: flex; align-items: center; gap: 14px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-width: 0; }
.reward .pic { flex: none; width: 76px; height: 76px; border-radius: 14px; overflow: hidden; display: grid; place-items: center; background: linear-gradient(150deg, var(--hero-a), var(--hero-b)); color: #fff; }
.reward .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.reward b { font: 800 1.05rem/1.2 var(--font-display); overflow-wrap: anywhere; }
.lcard { padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
.dot { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--line); color: var(--muted); font-weight: 700; overflow: hidden; }
.dot.on { background: var(--accent); border: 2px solid var(--accent); color: var(--accent-fg); }
.dot.gift { width: 50px; height: 50px; border-style: solid; border-color: var(--gold); color: var(--accent-text); }
.dot.gift.on { background: var(--gold); border-color: var(--gold); color: #3A1608; }
.dot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stats div { padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 2px; }
.stats b { font: 800 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: .82rem; }
.rank { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.rank.me { border-color: var(--accent); }
.rank .pos { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--soft); font-weight: 800; }
.rank .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }

/* Actions rapides, réglages, texte défilant, carte à gratter, avis */
.gift { display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 16px; padding: 14px 16px; background: var(--gold); color: #3A1608; font-weight: 800; text-align: center; box-shadow: var(--shadow); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.02); } }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.mq { overflow: hidden; border-radius: 16px; padding: 12px 0; font-weight: 800; font-size: 1.05rem; }
.mqt { display: flex; width: max-content; animation: mq var(--d, 16s) linear infinite; }
.mqh { display: block; flex: none; white-space: nowrap; }
.mqh .rep { padding-right: 2.5em; }
@keyframes mq { to { transform: translateX(-50%); } }
.mqs { padding: 12px 14px; border-radius: 16px; font-weight: 800; text-align: center; text-wrap: balance; overflow-wrap: anywhere; }
.ad .mq, .ad .mqs { border-radius: 0; }
.shut { margin-top: 16px; padding: 12px 14px; border-radius: 16px; background: var(--fg); color: var(--bg); text-align: center; text-wrap: balance; }
.lay-1 .grid, .lay-list .grid { grid-template-columns: minmax(0, 1fr); }
.lay-1 .tile { aspect-ratio: 16 / 10; }
.lay-list .card { flex-direction: row; align-items: stretch; }
.lay-list .tile { flex: none; width: 112px; aspect-ratio: auto; min-height: 104px; }
.nodesc .cdesc { display: none; }
.scw { position: relative; width: 100%; max-width: 360px; aspect-ratio: 16 / 10; margin: 0 auto; border-radius: 20px; overflow: hidden; background: linear-gradient(150deg, var(--hero-a), var(--hero-b)); box-shadow: var(--shadow); }
.scp { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px; text-align: center; color: #fff; }
.scp span { font-size: 2.2rem; line-height: 1; }
.scp b { font: 800 1.25rem/1.2 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; }
.scw canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .6s; }
.prize { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: var(--soft); border: 1px dashed var(--accent); }
.prize b { font: 800 1.1rem/1.2 var(--font-display); overflow-wrap: anywhere; }
.code { font: 800 1.5rem/1 var(--font-display); letter-spacing: .12em; user-select: all; padding: 10px 12px; background: var(--surface); border-radius: 12px; text-align: center; border: 1px solid var(--line); }
.fbe button { font-size: 1.5rem; padding: 8px 12px; }
.fbe button[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); box-shadow: 0 0 0 2px var(--accent); }
.fbv { padding: 10px 12px; border-radius: 14px; background: var(--soft); overflow-wrap: anywhere; }
.swrow { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg) inset; }
.pres { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pre { border: 0; border-radius: 14px; padding: 14px 10px; color: #fff; font-weight: 700; text-shadow: 0 1px 2px rgba(0, 0, 0, .45); }
.logoprev { flex: none; display: grid; place-items: center; width: 120px; height: 72px; background: #fff; border-radius: 14px; border: 1px solid var(--line); padding: 6px; }
.logoprev img { max-width: 100%; max-height: 100%; display: block; }
.ctrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; flex-wrap: wrap; }
.sel { user-select: text; font: 800 1.15rem/1.2 var(--font-display); overflow-wrap: anywhere; }
.inl { display: flex; gap: 8px; align-items: center; }
.inl input { flex: 1; min-width: 0; text-transform: uppercase; }
input[type="color"] { width: 64px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.pillrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

@media (prefers-reduced-motion: reduce) {
  .mqt { animation: none; width: auto; justify-content: center; padding: 0 14px; }
  .mqh { white-space: normal; text-align: center; }
  .mqh + .mqh, .mqh .rep + .rep { display: none; }
  .scw canvas { transition: none; }
  .gift { animation: none; }
}

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .card:active { transform: none; }
}
</style>

    else if (a === "cq") { S.cart[i].qty = Math.max(1, Math.min(50, S.cart[i].qty + d)); persistCart(); renderBar(); renderSheet(); }
    else if (a === "rm") { S.cart.splice(i, 1); persistCart(); renderBar(); renderSheet(); }
    else if (a === "tocheckout") showSheet("checkout");
    else if (a === "tocart") showSheet("cart");
    else if (a === "submit") submit();
    else if (a === "copy") copyRecap();
    else if (a === "tab") { S.tab = b.getAttribute("data-t"); renderSheet(); }
    else if (a === "next") setStatus(b.getAttribute("data-no"), b.getAttribute("data-s"));
    else if (a === "testorder") testOrder();
    else if (a === "deltests") delTests();
    else if (a === "emo") { var t = $("bText"); t.value = (t.value + b.getAttribute("data-e")).slice(0, 120); ADM.banner.text = t.value; t.focus(); }
    else if (a === "rmpromo") { delete ADM.promos[b.getAttribute("data-id")]; renderSheet(); }
    else if (a === "addpromo") {
      var pct = Math.round(Number($("pPct").value));
      if (!(pct >= 1 && pct <= 90)) { $("pErr").textContent = "Entrez une réduction entre 1 et 90 %."; $("pPct").focus(); return; }
      ADM.promos[$("pItem").value] = { pct: pct, until: $("pUntil").value || "", label: ($("pLabel").value || "").trim() };
      renderSheet();
    }
    else if (a === "addzone") { ADM.zones.push({ n: "", f: 1500 }); renderSheet(); var zs = sheet.querySelectorAll('[data-k="n"]'); if (zs.length) zs[zs.length - 1].focus(); }
    else if (a === "rmzone") { ADM.zones.splice(i, 1); renderSheet(); }
    else if (a === "save") saveSettings();
    else if (a === "newdish") { var nid = "x" + Date.now().toString(36); ADM.custom.push({ id: nid, c: "chawarma", n: "", d: "", p: 2000 }); S.edit = nid; renderSheet(); var en = $("eName"); if (en) en.focus(); }
    else if (a === "editdish") { S.edit = b.getAttribute("data-id"); renderSheet(); }
    else if (a === "enddish") { S.edit = null; renderSheet(); }
    else if (a === "delcustom") { ADM.custom = ADM.custom.filter(function (c) { return c.id !== S.edit; }); S.edit = null; renderSheet(); }
    else if (a === "rmphoto") { tgt().img = ""; renderSheet(); }
    else if (a === "rmad") { ADM.ads.splice(i, 1); renderSheet(); }
    else if (a === "rmloyimg") { ADM.loy.img = ""; renderSheet(); }
    else if (a === "claim") claimGift(b.getAttribute("data-k"));
    else if (a === "hist") { var hk = b.getAttribute("data-k"); S.openCust = S.openCust === hk ? null : hk; refreshLoy(); }
    else if (a === "toloy") { S.loyPhone = S.order ? S.order.o.phone : S.loyPhone; showSheet("loy"); }
    else if (a === "tohist") showSheet("hist");
    else if (a === "paid") markPaid(b.getAttribute("data-no"));
    else if (a === "reorder") reorder(b.getAttribute("data-no"));
    else if (a === "confirmpay") confirmPay(b.getAttribute("data-no"));
    else if (a === "logout") { if (window.__logout) window.__logout(); }
    else if (a === "scratch") openScratch(b.getAttribute("data-no"));
    else if (a === "screveal") revealNow();
    else if (a === "copycode") copyText(b.getAttribute("data-c"), b.parentNode.querySelector(".code"));
    else if (a === "copytxt") copyText(b.getAttribute("data-t"), b.closest(".ctrow").querySelector(".sel"));
    else if (a === "fbe") { var fn = b.getAttribute("data-no"), fe = b.getAttribute("data-e"); S.fbe[fn] = S.fbe[fn] === fe ? "" : fe; rerender(); }
    else if (a === "fbsend") sendFb(b.getAttribute("data-no"));
    else if (a === "applycode") applyCode();
    else if (a === "rmcode") { S.cp = null; S.cpErr = ""; $("cpMsg").innerHTML = ""; $("cCode").value = ""; $("sum").innerHTML = sumHTML(); }
    else if (a === "mqc") { var mc = b.getAttribute("data-c"), ix = ADM.banner.cols.indexOf(mc); if (ix >= 0) ADM.banner.cols.splice(ix, 1); else ADM.banner.cols.push(mc); renderSheet(); }
    else if (a === "mqbg") { var mb = b.getAttribute("data-c"); ADM.banner.bg = ADM.banner.bg === mb ? "" : mb; renderSheet(); }
    else if (a === "preset") { var pz = PRESETS[i]; ADM.ui.heroA = pz[1]; ADM.ui.heroB = pz[2]; ADM.ui.accent = pz[3]; renderSheet(); }
    else if (a === "bg") { ADM.ui.bg = b.getAttribute("data-c"); renderSheet(); }
    else if (a === "resetcol") { ADM.ui.heroA = ADM.ui.heroB = ADM.ui.accent = ADM.ui.bg = ""; renderSheet(); }
    else if (a === "rmlogo") { ADM.ui.logo = ""; renderSheet(); }
    else if (a === "catup" || a === "catdn") { var co = catsEff(ADM, true).map(function (c) { return c.id; }), id = b.getAttribute("data-id"), p = co.indexOf(id), q = p + (a === "catup" ? -1 : 1); if (q >= 0 && q < co.length) { co.splice(q, 0, co.splice(p, 1)[0]); ADM.ui.cats = co; renderSheet(); } }
    else if (a === "addprize") { ADM.scr.prizes.push(b.getAttribute("data-k") === "disc" ? { id: "p" + Date.now().toString(36), k: "disc", v: 500, l: "", w: 3 } : { id: "p" + Date.now().toString(36), k: "free", v: 0, l: "", w: 3 }); renderSheet(); }
    else if (a === "rmprize") { ADM.scr.prizes.splice(i, 1); renderSheet(); }
  });
  sheet.addEventListener("change", function (e) {
    var t = e.target;
    if (t.name === "size") { S.sel.size = parseInt(t.value, 10); updAdd(); }
    else if (t.name === "extra") { var k = parseInt(t.value, 10), at = S.sel.extras.indexOf(k); if (t.checked && at < 0) S.sel.extras.push(k); if (!t.checked && at >= 0) S.sel.extras.splice(at, 1); updAdd(); }
    else if (t.name === "mode") { S.mode = t.value; renderSheet(); var c = sheet.querySelector('input[name="mode"]:checked'); if (c) c.focus(); }
    else if (t.name === "pay") S.pay = t.value;
    else if (t.name === "theme") ADM.theme = t.value;
    else if (t.id === "bOn") ADM.banner.on = t.checked;
    else if (t.id === "cZone") { S.zone = t.value; $("sum").innerHTML = sumHTML(); }
    else if (t.id === "eOn") tgt().off = !t.checked;
    else if (t.id === "eShow") tgt().hide = !t.checked;
    else if (t.id === "eCat") { tgt().c = t.value; renderSheet(); }
    else if (t.id === "eFile") { if (t.files && t.files[0]) pickPhoto(t.files[0]); }
    else if (t.id === "aFile") { if (t.files && t.files[0]) pickAd(t.files[0]); }
    else if (t.id === "lFile") { if (t.files && t.files[0]) pickLoyPhoto(t.files[0]); }
    else if (t.id === "lOn") ADM.loy.on = t.checked;
    else if (t.id === "bMq") { ADM.banner.mq = t.checked; renderSheet(); }
    else if (t.id === "shOpen") ADM.shop.open = t.checked;
    else if (t.id === "shAuto") ADM.shop.auto = t.checked;
    else if (t.id === "uDesc") ADM.ui.desc = t.checked;
    else if (t.id === "sOn") ADM.scr.on = t.checked;
    else if (t.name === "lay") ADM.ui.lay = t.value;
    else if (t.name === "rad") ADM.ui.rad = t.value;
    else if (t.id === "uLogo") { if (t.files && t.files[0]) pickLogo(t.files[0]); }
    else if (t.hasAttribute("data-chide")) { ADM.ui.chide[t.getAttribute("data-chide")] = !t.checked; }
    else if (t.hasAttribute("data-admq")) { var am = ADM.ads[parseInt(t.getAttribute("data-admq"), 10)]; if (am) am.mq = t.checked; }
    else if (t.hasAttribute("data-pz") && t.getAttribute("data-k") === "k") { ADM.scr.prizes[parseInt(t.getAttribute("data-pz"), 10)].k = t.value; renderSheet(); }
    else if (t.hasAttribute("data-adon")) { var ai = ADM.ads[parseInt(t.getAttribute("data-adon"), 10)]; if (ai) ai.on = t.checked; }
    else if (t.hasAttribute("data-av")) { tgt(t.getAttribute("data-av")).off = !t.checked; renderSheet(); }
  });
  sheet.addEventListener("input", function (e) {
    var t = e.target;
    if (t.hasAttribute("data-fbt")) { S.fbt[t.getAttribute("data-fbt")] = t.value; return; }
    if (t.hasAttribute("data-u")) { ADM.ui[t.getAttribute("data-u")] = t.value; return; }
    if (t.hasAttribute("data-sh")) { var sk = t.getAttribute("data-sh"); ADM.shop[sk] = sk === "min" ? Number(t.value) : t.value; return; }
    if (t.hasAttribute("data-pn")) { ADM.payn[t.getAttribute("data-pn")] = t.value; return; }
    if (t.hasAttribute("data-c")) { ADM.contact[t.getAttribute("data-c")] = t.value; return; }
    if (t.hasAttribute("data-s")) { ADM.scr[t.getAttribute("data-s")] = Number(t.value); return; }
    if (t.hasAttribute("data-pz")) { var pk = t.getAttribute("data-k"), pr2 = ADM.scr.prizes[parseInt(t.getAttribute("data-pz"), 10)]; if (pr2) pr2[pk] = (pk === "v" || pk === "w") ? Number(t.value) : t.value; return; }
    if (t.id === "lPhone") { S.loyPhone = t.value; $("loyDyn").innerHTML = loyDynHTML(); lsSet("tollest.loyphone", t.value); return; }
    if (t.hasAttribute("data-ad")) { var ad = ADM.ads[parseInt(t.getAttribute("data-ad"), 10)]; if (ad) ad[t.getAttribute("data-k")] = t.value; return; }
    if (t.hasAttribute("data-l")) { var lk = t.getAttribute("data-l"); ADM.loy[lk] = lk === "stamps" ? Number(t.value) : t.value; return; }
    if (t.id === "cName") S.name = t.value; else if (t.id === "cPhone") S.phone = t.value; else if (t.id === "cAddr") S.addr = t.value;
    else if (t.id === "bText") { ADM.banner.text = t.value; var mp = $("mqPrev"); if (mp) mp.innerHTML = mqHTML(t.value || "Le meilleur reste à venir", !!ADM.banner.mq, ADM.banner.cols, ADM.banner.bg); return; }
    else if (t.hasAttribute("data-z")) { var z = ADM.zones[parseInt(t.getAttribute("data-z"), 10)]; if (z) z[t.getAttribute("data-k")] = t.getAttribute("data-k") === "f" ? Number(t.value) : t.value; return; }
    else if (t.hasAttribute("data-e")) { var ek = t.getAttribute("data-e"); tgt()[ek] = ek === "p" ? (t.value === "" ? "" : Number(t.value)) : t.value; return; }
    else if (t.hasAttribute("data-sz")) { var o2 = tgt(); if (!o2.sz) o2.sz = []; o2.sz[parseInt(t.getAttribute("data-sz"), 10)] = t.value === "" ? null : Number(t.value); return; }
    else return;
    lsSet("tollest.cust", { name: S.name, phone: S.phone, addr: S.addr });
  });

  // Départ
  var lastOpen = shopOpen(); setInterval(function () { var o = shopOpen(); if (o !== lastOpen) { lastOpen = o; renderMenu(); } }, 30000);
  window.__onMedia = function () { if (!sheet.hidden && S.view === "admin") return; try { applySettings(); } catch (e) {} };
  var hr = new Date().getHours();
  GREET = hr >= 18 || hr < 5 ? "Bonsoir" : hr < 12 ? "Bonjour" : "Bon après-midi"; $("hello").textContent = GREET;
  renderChips(); renderMenu(); renderBar();

  // Base de données partagée (réglages, commandes) : la page reste utilisable sans elle.
  function use(n) { try { return window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } }
  use("user").then(function (u) {
    USER = u; if (!u) return;
    return Promise.all([u.canEdit(), u.isOwner(), u.id(), u.can("data.write")]).then(function (r) { IS_ADMIN = !!(r[0] || r[1]); ME = r[2]; CAN_WRITE = r[3]; });
  }).catch(function () {}).then(function () { return use("db"); }).then(function (db) {
    DB = db; if (!db) return;
    db.doc("settings/main").onSnapshot(function (s) {
      var d = s.exists ? s.data() : null; SET = d ? Object.assign(defSet(), d) : defSet();
      if (!SET.banner) SET.banner = { on: false, text: "" }; if (!SET.promos) SET.promos = {};
      applySettings();
    }, function () {});
    db.collection("status").onSnapshot(function (snap) {
      var was = STATS, loaded = STLOADED; STATS = {}; snap.docs.forEach(function (d) { STATS[d.id] = d.data(); }); STLOADED = true; refreshOrders(); refreshHist();
      if (loaded) { var win = myOrders().filter(function (o) { return STATS[o.no] && STATS[o.no].s === "livree" && !(was[o.no] && was[o.no].s === "livree") && canScratch(o); })[0]; if (win) { toast("Commande livrée ! Une carte à gratter vous attend 🎁"); if (sheet.hidden || S.view === "hist" || S.view === "done") openScratch(win.no); } }
    }, function () {});
    if (ME) db.doc("orders/" + ME).onSnapshot(function (s) { MYDB = s.exists ? (s.data().list || []) : []; refreshHist(); }, function () {});
    db.collection("loyalty").onSnapshot(function (snap) {
      LOYMAP = {}; snap.docs.forEach(function (d) { LOYMAP[d.id] = d.data(); }); refreshLoy();
    }, function () {});
    if (IS_ADMIN) {
      $("admBtn").hidden = false;
      use("assets").then(function (a) { ASSETS = a; });
      db.collection("coupons").onSnapshot(function (snap) { COUPONS = {}; snap.docs.forEach(function (d) { COUPONS[d.id] = d.data(); }); refreshOrders(); if (S.view === "admin" && S.tab === "scr" && $("cpList")) $("cpList").innerHTML = couponListHTML(); }, function () {});
      db.collection("orders").onSnapshot(function (snap) {
        var all = []; snap.docs.forEach(function (d) { var l = (d.data() || {}).list; if (Array.isArray(l)) l.forEach(function (o) { all.push(o); }); });
        all.sort(function (a, b) { return b.at - a.at; }); if (ORDCOUNT !== null && all.length > ORDCOUNT) beep(); ORDCOUNT = all.length; ORDERS = all; refreshOrders();
        if (S.view === "admin" && S.tab === "fb" && $("fbList")) $("fbList").innerHTML = fbListHTML();
      }, function () {});
    }
  }).catch(function () {});
})();
</script>

</body>
